<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>byeonwooseok • Instagram</title>
    <!-- 공식 FontAwesome 아이콘 라이브러리 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #fff; color: #000; padding-bottom: 60px; }
        
        /* 헤더 영역 */
        header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid #f0f0f0; position: sticky; top: 0; background: #fff; z-index: 100; }
        .header-left { display: flex; align-items: center; font-size: 1.2rem; cursor: pointer; }
        .header-username { font-size: 1.25rem; font-weight: 700; display: flex; align-items: center; gap: 6px; }
        
        /* 인스타그램 공식 인증 뱃지 (파란 톱니바퀴) */
        .verified-container { position: relative; display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; }
        .verified-bg { color: #0095f6; font-size: 18px; }
        .verified-check { color: #ffffff; font-size: 9px; position: absolute; }

        .header-right { display: flex; align-items: center; gap: 18px; font-size: 1.2rem; }

        /* 프로필 영역 */
        .profile-container { padding: 16px 16px 8px 16px; }
        .profile-top { display: flex; align-items: center; margin-bottom: 16px; }
        .profile-img-box { margin-right: 28px; }
        .profile-img { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; border: 1px solid #dbdbdb; }
        
        .profile-stats { display: flex; flex: 1; justify-content: space-around; text-align: center; }
        .stat-item { display: flex; flex-direction: column; }
        .stat-num { font-weight: 700; font-size: 1.05rem; }
        .stat-label { font-size: 0.8rem; color: #262626; margin-top: 1px; }

        /* 프로필 바이오 */
        .profile-bio { margin-bottom: 14px; font-size: 0.9rem; line-height: 1.4; }
        .bio-fullname { font-weight: 600; color: #000; }
        .bio-agency { color: #262626; margin-top: 4px; }
        .bio-followed-by { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 0.85rem; color: #262626; }
        .agency-icon { width: 22px; height: 22px; border-radius: 50%; background: #000; color: #fff; font-size: 0.5rem; display: flex; align-items: center; justify-content: center; font-weight: bold; }

        /* 하이라이트 */
        .highlights { display: flex; gap: 16px; overflow-x: auto; padding: 6px 0 12px 0; margin-bottom: 6px; }
        .highlight-item { display: flex; flex-direction: column; align-items: center; font-size: 0.75rem; width: 68px; flex-shrink: 0; }
        .highlight-circle { width: 64px; height: 64px; border-radius: 50%; border: 1px solid #dbdbdb; padding: 2px; margin-bottom: 6px; background-color: #fafafa; }
        .highlight-img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }

        /* 탭 바 */
        .tab-bar { display: flex; border-top: 1px solid #efefef; }
        .tab-item { flex: 1; text-align: center; padding: 10px 0; font-size: 1.3rem; color: #8e8e8e; cursor: pointer; }
        .tab-item.active { color: #000; border-bottom: 2px solid #000; }

        /* 피드 그리드 */
        .grid-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; }
        .grid-item { aspect-ratio: 1 / 1; position: relative; background-color: #f0f0f0; cursor: pointer; }
        .grid-item img { width: 100%; height: 100%; object-fit: cover; }

        /* 모달 팝업 */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center; padding: 16px; }
        .modal-card { background: #fff; width: 100%; max-width: 450px; border-radius: 12px; overflow: hidden; position: relative; }
        .modal-img { width: 100%; max-height: 400px; object-fit: cover; }
        .modal-body { padding: 14px 16px; }
        .modal-date { font-size: 0.75rem; color: #8e8e8e; margin-bottom: 6px; }
        .modal-text { font-size: 0.9rem; line-height: 1.4; }
        .close-btn { position: absolute; top: 12px; right: 16px; font-size: 24px; color: #fff; cursor: pointer; }
    </style>
</head>
<body>

    <!-- 헤더 영역 -->
    <header>
        <div class="header-left"><i class="fa-solid fa-arrow-left"></i></div>
        <div class="header-username">
            byeonwooseok
            <!-- 인스타그램 정품 파란 톱니바퀴 인증 뱃지 -->
            <span class="verified-container">
                <i class="fa-solid fa-certificate verified-bg"></i>
                <i class="fa-solid fa-check verified-check"></i>
            </span>
        </div>
        <div class="header-right">
            <i class="fa-regular fa-bell"></i>
            <i class="fa-solid fa-ellipsis-vertical"></i>
        </div>
    </header>

    <!-- 프로필 영역 -->
    <div class="profile-container">
        <div class="profile-top">
            <div class="profile-img-box">
                <!-- 저장소에 올려둔 profile.jpg 이미지를 불러옵니다 -->
                <img src="profile.jpg" class="profile-img" alt="변우석" onerror="this.style.display='none';">
            </div>
            <div class="profile-stats">
                <div class="stat-item">
                    <span class="stat-num" id="postCount">0</span>
                    <span class="stat-label">게시물</span>
                </div>
                <div class="stat-item">
                    <span class="stat-num">1705만</span>
                    <span class="stat-label">팔로워</span>
                </div>
                <div class="stat-item">
                    <span class="stat-num">165</span>
                    <span class="stat-label">팔로잉</span>
                </div>
            </div>
        </div>

        <!-- 바이오 내용 -->
        <div class="profile-bio">
            <div class="bio-fullname">변우석 Woo Seok Byeon</div>
            <div class="bio-agency">바로엔터테인먼트</div>
            <div class="bio-followed-by">
                <div class="agency-icon">VARO</div>
                <span><b>varoent_official</b>님이 팔로우합니다</span>
            </div>
        </div>

        <!-- 하이라이트 -->
        <div class="highlights">
            <div class="highlight-item">
                <div class="highlight-circle">
                    <div style="width:100%; height:100%; border-radius:50%; background:#efefef; display:flex; align-items:center; justify-content:center; color:#8e8e8e; font-size:10px;">🎂</div>
                </div>
                <span>생일 축하해줘서 ...</span>
            </div>
        </div>
    </div>

    <!-- 탭 아이콘 -->
    <div class="tab-bar">
        <div class="tab-item active"><i class="fa-solid fa-table-cells"></i></div>
        <div class="tab-item"><i class="fa-solid fa-clapperboard"></i></div>
        <div class="tab-item"><i class="fa-solid fa-rotate"></i></div>
        <div class="tab-item"><i class="fa-regular fa-id-badge"></i></div>
    </div>

    <!-- 피드 사진 그리드 -->
    <div class="grid-container" id="gridContainer"></div>

    <!-- 상세보기 모달 -->
    <div class="modal" id="postModal" onclick="closeModal()">
        <span class="close-btn">&times;</span>
        <div class="modal-card" onclick="event.stopPropagation()">
            <img class="modal-img" id="modalImg" src="">
            <div class="modal-body">
                <div class="modal-date" id="modalDate"></div>
                <div class="modal-text" id="modalText"></div>
            </div>
        </div>
    </div>

    <script>
        // 자동 수집 전 안내 데이터
        const archiveData = [];

        function renderGrid() {
            const container = document.getElementById('gridContainer');
            container.innerHTML = '';
            
            document.getElementById('postCount').innerText = archiveData.length;

            if (archiveData.length === 0) {
                container.innerHTML = `<div style="grid-column: 1 / -1; padding: 50px 0; text-align: center; color: #8e8e8e; font-size: 0.9rem;">
                    <i class="fa-solid fa-camera" style="font-size: 2rem; margin-bottom: 10px; display: block;"></i>
                    자동 수집 세팅을 완료하면<br>변우석 배우님의 인스타그램 게시물이 채워집니다 💙
                </div>`;
                return;
            }

            archiveData.forEach(item => {
                const div = document.createElement('div');
                div.className = 'grid-item';
                div.onclick = () => openModal(item);
                div.innerHTML = `<img src="${item.img}" alt="post">`;
                container.appendChild(div);
            });
        }

        function openModal(item) {
            document.getElementById('modalImg').src = item.img;
            document.getElementById('modalDate').innerText = item.date;
            document.getElementById('modalText').innerText = item.text;
            document.getElementById('postModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('postModal').style.display = 'none';
        }

        renderGrid();
    </script>
</body>
</html>
