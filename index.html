<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>byeonwooseok • Instagram</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                Roboto, Helvetica, Arial, sans-serif;
            background-color: #fff;
            color: #000;
            padding-bottom: 60px;
        }

        /* 헤더 */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid #f0f0f0;
            position: sticky;
            top: 0;
            background: #fff;
            z-index: 100;
        }

        .header-left {
            display: flex;
            align-items: center;
            font-size: 1.2rem;
            cursor: pointer;
        }

        .header-username {
            font-size: 1.25rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .verified-container {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 18px;
            height: 18px;
        }

        .verified-bg {
            color: #0095f6;
            font-size: 18px;
        }

        .verified-check {
            color: #ffffff;
            font-size: 9px;
            position: absolute;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 18px;
            font-size: 1.2rem;
        }

        /* 프로필 */
        .profile-container {
            padding: 16px 16px 8px 16px;
        }

        .profile-top {
            display: flex;
            align-items: center;
            margin-bottom: 16px;
        }

        .profile-img-box {
            margin-right: 28px;
        }

        .profile-img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid #dbdbdb;
        }

        .profile-stats {
            display: flex;
            flex: 1;
            justify-content: space-around;
            text-align: center;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
        }

        .stat-num {
            font-weight: 700;
            font-size: 1.05rem;
        }

        .stat-label {
            font-size: 0.8rem;
            color: #262626;
            margin-top: 1px;
        }

        .profile-bio {
            margin-bottom: 14px;
            font-size: 0.9rem;
            line-height: 1.4;
        }

        .bio-fullname {
            font-weight: 600;
            color: #000;
        }

        .bio-agency {
            color: #262626;
            margin-top: 4px;
        }

        .bio-followed-by {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
            font-size: 0.85rem;
            color: #262626;
        }

        .agency-icon {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #000;
            color: #fff;
            font-size: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        /* 하이라이트 */
        .highlights {
            display: flex;
            gap: 16px;
            overflow-x: auto;
            padding: 6px 0 12px 0;
            margin-bottom: 6px;
        }

        .highlight-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 0.75rem;
            width: 68px;
            flex-shrink: 0;
        }

        .highlight-circle {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            border: 1px solid #dbdbdb;
            padding: 2px;
            margin-bottom: 6px;
            background-color: #fafafa;
        }

        /* 탭 */
        .tab-bar {
            display: flex;
            border-top: 1px solid #efefef;
        }

        .tab-item {
            flex: 1;
            text-align: center;
            padding: 10px 0;
            font-size: 1.3rem;
            color: #8e8e8e;
            cursor: pointer;
        }

        .tab-item.active {
            color: #000;
            border-bottom: 2px solid #000;
        }

        /* 피드 */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2px;
        }

        .grid-item {
            aspect-ratio: 1 / 1;
            position: relative;
            background-color: #f0f0f0;
            cursor: pointer;
        }

        .grid-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .multi-icon {
            position: absolute;
            top: 8px;
            right: 8px;
            color: #fff;
            font-size: 0.9rem;
            filter: drop-shadow(0 0 2px rgba(0,0,0,0.5));
        }

        /* 모달 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .modal-card {
            background: #fff;
            width: 100%;
            max-width: 450px;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
        }

        .slider-wrapper {
            position: relative;
            width: 100%;
            height: 380px;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* 슬라이드 버튼 */
        .slide-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0,0,0,0.4);
            color: #fff;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
        }

        .slide-btn.left {
            left: 10px;
        }

        .slide-btn.right {
            right: 10px;
        }

        .slide-btn:disabled {
            display: none;
        }

        /* 도트 */
        .indicator-box {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 6px;
        }

        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(255,255,255,0.4);
        }

        .dot.active {
            background: #0095f6;
        }

        /* 모달 내용 */
        .modal-body {
            padding: 14px 16px 16px;
        }

        .modal-date {
            font-size: 0.75rem;
            color: #8e8e8e;
            margin-bottom: 6px;
        }

        .modal-text {
            font-size: 0.9rem;
            line-height: 1.4;
            white-space: pre-line;
            margin-bottom: 14px;
        }

        /* ⭐ 인스타 원본 링크 */
        .instagram-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 12px;
            border: 1px solid #dbdbdb;
            border-radius: 8px;
            color: #262626;
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 600;
            background: #fff;
            transition: background 0.2s;
        }

        .instagram-link:hover {
            background: #f5f5f5;
        }

        .close-btn {
            position: absolute;
            top: 12px;
            right: 16px;
            font-size: 24px;
            color: #fff;
            cursor: pointer;
            z-index: 1001;
        }
    </style>
</head>

<body>

    <!-- 헤더 -->
    <header>
        <div class="header-left">
            <i class="fa-solid fa-arrow-left"></i>
        </div>

        <div class="header-username">
            byeonwooseok
            <span class="verified-container">
                <i class="fa-solid fa-certificate verified-bg"></i>
                <i class="fa-solid fa-check verified-check"></i>
            </span>
        </div>

        <div class="header-right">
            <i class="fa-regular fa-bell"></i>
            <i class="fa-solid fa-ellipsis-vertical"></i>
        </div>
    </header>

    <!-- 프로필 -->
    <div class="profile-container">

        <div class="profile-top">

            <div class="profile-img-box">
                <img
                    src="profile.jpg"
                    class="profile-img"
                    alt="변우석"
                >
            </div>

            <div class="profile-stats">

                <div class="stat-item">
                    <span class="stat-num" id="postCount">0</span>
                    <span class="stat-label">게시물</span>
                </div>

                <div class="stat-item">
                    <span class="stat-num">1705만</span>
                    <span class="stat-label">팔로워</span>
                </div>

                <div class="stat-item">
                    <span class="stat-num">165</span>
                    <span class="stat-label">팔로잉</span>
                </div>

            </div>

        </div>

        <div class="profile-bio">
            <div class="bio-fullname">
                변우석 Woo Seok Byeon
            </div>

            <div class="bio-agency">
                바로엔터테인먼트
            </div>

            <div class="bio-followed-by">
                <div class="agency-icon">VARO</div>
                <span>
                    <b>varoent_official</b>님이 팔로우합니다
                </span>
            </div>
        </div>

        <div class="highlights">

            <div class="highlight-item">

                <div class="highlight-circle">
                    <div style="
                        width:100%;
                        height:100%;
                        border-radius:50%;
                        background:#efefef;
                        display:flex;
                        align-items:center;
                        justify-content:center;
                        color:#8e8e8e;
                        font-size:10px;
                    ">
                        🎂
                    </div>
                </div>

                <span>생일 축하해줘서 ...</span>

            </div>

        </div>

    </div>

    <!-- 탭 -->
    <div class="tab-bar">
        <div class="tab-item active">
            <i class="fa-solid fa-table-cells"></i>
        </div>

        <div class="tab-item">
            <i class="fa-solid fa-clapperboard"></i>
        </div>

        <div class="tab-item">
            <i class="fa-solid fa-rotate"></i>
        </div>

        <div class="tab-item">
            <i class="fa-regular fa-id-badge"></i>
        </div>
    </div>

    <!-- 피드 -->
    <div class="grid-container" id="gridContainer"></div>

    <!-- 상세 모달 -->
    <div
        class="modal"
        id="postModal"
        onclick="closeModal()"
    >

        <span
            class="close-btn"
            onclick="closeModal()"
        >
            &times;
        </span>

        <div
            class="modal-card"
            onclick="event.stopPropagation()"
        >

            <div class="slider-wrapper">

                <button
                    class="slide-btn left"
                    id="prevBtn"
                    onclick="changeSlide(-1)"
                >
                    <i class="fa-solid fa-chevron-left"></i>
                </button>

                <img
                    class="modal-img"
                    id="modalImg"
                    src=""
                    alt="게시물 이미지"
                >

                <button
                    class="slide-btn right"
                    id="nextBtn"
                    onclick="changeSlide(1)"
                >
                    <i class="fa-solid fa-chevron-right"></i>
                </button>

                <div
                    class="indicator-box"
                    id="indicatorBox"
                ></div>

            </div>

            <div class="modal-body">

                <div
                    class="modal-date"
                    id="modalDate"
                ></div>

                <div
                    class="modal-text"
                    id="modalText"
                ></div>

                <!-- ⭐ 원본 인스타그램 게시물 -->
                <a
                    id="instagramLink"
                    class="instagram-link"
                    href="#"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    <i class="fa-brands fa-instagram"></i>
                    인스타그램에서 보기
                    <i class="fa-solid fa-arrow-up-right-from-square"></i>
                </a>

            </div>

        </div>

    </div>

    <script>

        let archiveData = [];
        let currentImages = [];
        let currentImgIndex = 0;

        /* posts.json 불러오기 */
        fetch('posts.json')
            .then(res => res.json())
            .then(data => {

                archiveData = data;

                /*
                 * 날짜가 최신 → 과거 순서로 자동 정렬
                 */
                archiveData.sort((a, b) => {
                    return new Date(b.date) - new Date(a.date);
                });

                renderGrid();

            })
            .catch(err => {

                console.error('posts.json 불러오기 실패:', err);

                renderGrid();

            });


        /* 그리드 생성 */
        function renderGrid() {

            const container =
                document.getElementById('gridContainer');

            container.innerHTML = '';

            document.getElementById('postCount').innerText =
                archiveData.length;

            if (archiveData.length === 0) {

                container.innerHTML = `
                    <div style="
                        grid-column: 1 / -1;
                        padding: 50px 0;
                        text-align: center;
                        color: #8e8e8e;
                        font-size: 0.9rem;
                    ">
                        <i
                            class="fa-solid fa-camera"
                            style="
                                font-size: 2rem;
                                margin-bottom: 10px;
                                display: block;
                            "
                        ></i>

                        posts.json에 게시글을 추가해 주세요 💙
                    </div>
                `;

                return;
            }


            archiveData.forEach(item => {

                const imgList =
                    item.images ||
                    (item.img ? [item.img] : []);

                const mainImg =
                    imgList[0] || 'profile.jpg';

                const isMulti =
                    imgList.length > 1;

                const div =
                    document.createElement('div');

                div.className = 'grid-item';

                div.onclick = () => openModal(item);

                div.innerHTML = `
                    <img
                        src="${mainImg}"
                        alt="post"
                        loading="lazy"
                    >

                    ${
                        isMulti
                            ? '<i class="fa-solid fa-clone multi-icon"></i>'
                            : ''
                    }
                `;

                container.appendChild(div);

            });

        }


        /* 게시물 열기 */
        function openModal(item) {

            currentImages =
                item.images ||
                (item.img ? [item.img] : []);

            currentImgIndex = 0;

            document.getElementById('modalDate').innerText =
                item.date || '';

            document.getElementById('modalText').innerText =
                item.text || '';


            /*
             * ⭐ 인스타그램 원본 링크
             */
            const instagramLink =
                document.getElementById('instagramLink');

            if (item.url) {

                instagramLink.href = item.url;
                instagramLink.style.display = 'inline-flex';

            } else {

                instagramLink.href = '#';
                instagramLink.style.display = 'none';

            }


            updateSlider();

            document.getElementById('postModal').style.display =
                'flex';

        }


        /* 슬라이더 */
        function updateSlider() {

            if (currentImages.length === 0) {

                document.getElementById('modalImg').src =
                    'profile.jpg';

                return;

            }

            document.getElementById('modalImg').src =
                currentImages[currentImgIndex];


            const prevBtn =
                document.getElementById('prevBtn');

            const nextBtn =
                document.getElementById('nextBtn');


            prevBtn.disabled =
                currentImgIndex === 0;

            nextBtn.disabled =
                currentImgIndex === currentImages.length - 1;


            if (currentImages.length <= 1) {

                prevBtn.style.display = 'none';
                nextBtn.style.display = 'none';

            } else {

                prevBtn.style.display =
                    currentImgIndex === 0
                        ? 'none'
                        : 'flex';

                nextBtn.style.display =
                    currentImgIndex === currentImages.length - 1
                        ? 'none'
                        : 'flex';

            }


            /* 도트 생성 */
            const indicatorBox =
                document.getElementById('indicatorBox');

            indicatorBox.innerHTML = '';


            if (currentImages.length > 1) {

                currentImages.forEach((_, idx) => {

                    const dot =
                        document.createElement('div');

                    dot.className =
                        `dot ${
                            idx === currentImgIndex
                                ? 'active'
                                : ''
                        }`;

                    indicatorBox.appendChild(dot);

                });

            }

        }


        /* 사진 넘기기 */
        function changeSlide(direction) {

            currentImgIndex += direction;

            if (currentImgIndex < 0) {
                currentImgIndex = 0;
            }

            if (
                currentImgIndex >=
                currentImages.length
            ) {
                currentImgIndex =
                    currentImages.length - 1;
            }

            updateSlider();

        }


        /* 모달 닫기 */
        function closeModal() {

            document.getElementById('postModal').style.display =
                'none';

        }


        /* ESC로 모달 닫기 */
        document.addEventListener(
            'keydown',
            function(event) {

                if (event.key === 'Escape') {
                    closeModal();
                }

            }
        );

    </script>

</body>
</html>
